name: Job Tracker

on:
  schedule:
    # Runs at 1pm, 6pm, and 10pm IST daily (07:30, 12:30, 16:30 UTC).
    - cron: '30 7,12,16 * * *'
  workflow_dispatch: {}  # allows manual "Run workflow" trigger from the Actions tab

permissions:
  contents: write  # needed to commit the updated spreadsheet + seen_jobs.json back to the repo

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job tracker
        id: run_tracker
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tracker.py

      - name: Commit updated data
        run: |
          git config user.name "job-tracker-bot"
          git config user.email "actions@github.com"
          git add data/job_matches.xlsx data/seen_jobs.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Update job tracker $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            TEXT="Job Tracker run OK: ${{ steps.run_tracker.outputs.new_count }} new job(s) added, ${{ steps.run_tracker.outputs.reclosed_count }} listing(s) newly marked closed."
          else
            TEXT="Job Tracker run FAILED. Check the Actions log."
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${TEXT}"
